<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Quaqu's Portfolio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='tasks_css/tasks.css') }}">
</head>
<body>
    <a href="/" class="back-btn">← Back to Portfolio</a>
    
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>✅ Task Manager</h1>
            <p>Organize your tasks and boost productivity</p>
        </header>

        <!-- Statistics Section -->
        <section class="stats-section">
            <div class="stat-card">
                <div class="stat-number" id="total-tasks">0</div>
                <div class="stat-label">Total Tasks</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="completed-tasks">0</div>
                <div class="stat-label">Completed</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pending-tasks">0</div>
                <div class="stat-label">Pending</div>
            </div>
        </section>

        <!-- Add Task Section -->
        <section class="add-task-section">
            <h2>Add New Task</h2>
            <form id="task-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="task-title">Task Title *</label>
                        <input type="text" id="task-title" placeholder="Enter task title" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="task-description">Description</label>
                        <textarea id="task-description" rows="3" placeholder="Add details about your task"></textarea>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="task-category">Category</label>
                        <select id="task-category">
                            <option value="Personal">Personal</option>
                            <option value="Work">Work</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Health">Health</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="task-priority">Priority</label>
                        <select id="task-priority">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="task-due-date">Due Date</label>
                        <input type="date" id="task-due-date">
                    </div>
                </div>

                <button type="submit" class="btn-primary">Add Task</button>
            </form>
        </section>

        <!-- Filter Section -->
        <section class="filter-section">
            <button class="filter-btn active" data-filter="all">All Tasks</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </section>

        <!-- Tasks List -->
        <section class="tasks-section">
            <div id="loading" class="loading" style="display: none;">Loading tasks...</div>
            <div id="tasks-container"></div>
            <div id="no-tasks" class="no-tasks" style="display: none;">
                <p>No tasks yet. Add your first task above!</p>
            </div>
        </section>
    </div>

    <script src="{{ url_for('static', filename='tasks_js/tasks.js') }}"></script>
</body>
</html>
