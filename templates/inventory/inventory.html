<!DOCTYPE html>
<html>
<head>
    <title>Spare Parts Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script> <!-- The Scanner Library -->
    <style>
        .low-stock { border-left: 5px solid red; background-color: #fff5f5; }
        #reader { width: 100%; max-width: 400px; margin: 10px auto; border-radius: 10px; overflow: hidden; }
    </style>
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="d-flex justify-content-between mb-3">
            <h3>⚙️ Spare Parts</h3>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addPartModal">+ Add</button>
        </div>

        <!-- Search & Scan Bar -->
        <div class="input-group mb-3">
            <input type="text" id="searchInput" class="form-control" placeholder="Search by Name or SKU...">
            <button class="btn btn-primary" onclick="toggleScanner()">📷 Scan</button>
        </div>

        <div id="scanner-container" style="display:none;" class="text-center mb-3">
            <div id="reader"></div>
            <button class="btn btn-sm btn-danger" onclick="toggleScanner()">Close Camera</button>
        </div>

        <div id="inventoryList"></div>
    </div>

    <!-- Add Part Modal -->
    <div class="modal fade" id="addPartModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5>Add New Part</h5></div>
                <form id="addPartForm" class="modal-body">
                    <input type="text" id="p_name" class="form-control mb-2" placeholder="Part Name" required>
                    <input type="text" id="p_sku" class="form-control mb-2" placeholder="SKU / Barcode" required>
                    <input type="number" id="p_qty" class="form-control mb-2" placeholder="Quantity" value="0">
                    <input type="text" id="p_loc" class="form-control mb-2" placeholder="Location (e.g. Bin A1)">
                    <button type="submit" class="btn btn-primary w-100">Save Part</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let scanner = null;

        // Fix 1: escape text before putting it into innerHTML
        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s ?? '';
            return d.innerHTML;
        }

        async function loadParts(query = '') {
            // Fix 2: URL-encode the search text
            const res = await fetch(`/api/inventory?search=${encodeURIComponent(query)}`);
            const data = await res.json();
            const container = document.getElementById('inventoryList');
            if (!data.parts || data.parts.length === 0) {
                container.innerHTML = '<p class="text-muted text-center">No parts found.</p>';
                return;
            }
            container.innerHTML = data.parts.map(p => `
                <div class="card mb-2 shadow-sm ${p.quantity <= p.min_stock_level ? 'low-stock' : ''}">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <strong>${esc(p.part_name)}</strong> <br>
                            <small class="text-muted">SKU: ${esc(p.sku)} | Loc: ${esc(p.location)}</small>
                        </div>
                        <div class="text-end">
                            <span class="badge ${p.quantity <= p.min_stock_level ? 'bg-danger' : 'bg-success'}">
                                Qty: ${p.quantity}
                            </span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function toggleScanner() {
            const con = document.getElementById('scanner-container');
            if(con.style.display === 'none') {
                con.style.display = 'block';
                scanner = new Html5Qrcode("reader");
                scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, (text) => {
                    document.getElementById('searchInput').value = text;
                    loadParts(text);
                    toggleScanner();
                });
            } else {
                con.style.display = 'none';
                if(scanner) scanner.stop();
            }
        }

        document.getElementById('addPartForm').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                part_name: document.getElementById('p_name').value,
                sku: document.getElementById('p_sku').value,
                quantity: document.getElementById('p_qty').value,
                location: document.getElementById('p_loc').value,
                category: 'General', min_stock_level: 2
            };
            const res = await fetch('/api/inventory', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const result = await res.json();
            // Fix 3: only reload when the save actually succeeded
            if (result.success) {
                location.reload();
            } else {
                alert(result.error || 'Could not save part');
            }
        };

        document.getElementById('searchInput').oninput = (e) => loadParts(e.target.value);
        loadParts();
    </script>
</body>
</html>
